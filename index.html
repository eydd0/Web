<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeathNote C</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #050505; color: #fff; }
        .glass { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 255, 0.1); }
        .active-tab { border-bottom: 2px solid #06b6d4; color: #06b6d4; }
    </style>
</head>
<body class="p-4">

    <!-- الهيدر -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-cyan-500">DEATH NOTE C</h1>
        <div id="status" class="w-3 h-3 rounded-full bg-red-500"></div>
    </div>

    <!-- لوحة الدخول -->
    <div id="login-box" class="glass p-6 rounded-2xl">
        <input type="password" id="token" placeholder="Paste token here..." class="w-full bg-black/50 border border-cyan-900 p-3 rounded-xl mb-4 outline-none">
        <button onclick="login()" class="w-full bg-cyan-600 p-3 rounded-xl font-bold">CONNECT & SAVE</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="main-panel" class="hidden space-y-4">
        <!-- تبديل الأقسام -->
        <div class="flex gap-4 overflow-x-auto pb-2 text-sm font-bold text-gray-400">
            <button onclick="switchTab('channels')" class="active-tab">CHANNELS</button>
            <button onclick="switchTab('roles')">ROLES</button>
            <button onclick="switchTab('spam')">SPAM</button>
            <button onclick="switchTab('server')">SERVER</button>
        </div>

        <!-- محتوى القسم -->
        <div class="glass p-4 rounded-xl space-y-3">
            <div id="tab-content">
                <!-- هذا القسم يتغير حسب الزر المختار -->
                <h3 class="text-cyan-500 font-bold mb-2">CHANNELS</h3>
                <button class="w-full bg-red-900/20 border border-red-500 p-2 rounded-lg text-sm">Delete All Channels</button>
                <input type="text" placeholder="Channel Name" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg mt-2">
                <input type="number" placeholder="Count" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg mt-2">
                <button class="w-full bg-cyan-600 p-2 rounded-lg mt-2 font-bold">CREATE CHANNELS</button>
            </div>
        </div>
        
        <!-- زر الـ ALL -->
        <button class="w-full bg-red-600 p-4 rounded-xl font-bold animate-pulse">ALL SETTINGS (EXECUTE)</button>
    </div>

    <script>
        function login() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-panel').classList.remove('hidden');
            document.getElementById('status').className = 'w-3 h-3 rounded-full bg-green-500';
        }

        function switchTab(tab) {
            const content = document.getElementById('tab-content');
            if(tab === 'channels') {
                content.innerHTML = `<h3 class="text-cyan-500 font-bold mb-2">CHANNELS</h3><button class="w-full bg-red-900/20 border border-red-500 p-2 rounded-lg text-sm">Delete All Channels</button><input type="text" placeholder="Name" class="w-full bg-black/50 border border-gray-700 p-2 rounded-lg mt-2"><button class="w-full bg-cyan-600 p-2 rounded-lg mt-2 font-bold">CREATE</button>`;
            } else if(tab === 'roles') {
                content.innerHTML = `<h3 class="text-cyan-500 font-bold mb-2">ROLES</h3><button class="w-full bg-red-900/20 border border-red-500 p-2 rounded-lg text-sm">Delete All Roles</button><button class="w-full bg-green-900/20 border border-green-500 p-2 rounded-lg mt-2">Give Everyone Admin</button>`;
            } else if(tab === 'spam') {
                content.innerHTML = `<h3 class="text-cyan-500 font-bold mb-2">SPAM</h3><textarea class="w-full bg-black/50 p-2 rounded-lg" placeholder="Message..."></textarea><button class="w-full bg-cyan-600 p-2 rounded-lg mt-2">START SPAM</button>`;
            } else if(tab === 'server') {
                content.innerHTML = `<h3 class="text-cyan-500 font-bold mb-2">SERVER</h3><button class="w-full bg-red-900/20 border border-red-500 p-2 rounded-lg">Delete All Emojis</button><input placeholder="New Server Name" class="w-full bg-black/50 p-2 mt-2 rounded-lg">`;
            }
        }
    </script>
</body>
</html>
